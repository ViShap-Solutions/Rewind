name: Rewind CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'support/**'

  push:
    branches:
      - main
      - 'release/**'
      - 'support/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore Rewind.slnx

      - name: Build solution
        run: >
          dotnet build
          Rewind.slnx
          --configuration Release
          --no-restore

      - name: Run core tests
        run: >
          dotnet test
          tests/ViShap.Rewind.Core.Tests/ViShap.Rewind.Core.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=core-tests.trx"

      - name: Run generator tests
        run: >
          dotnet test
          tests/ViShap.Rewind.Generator.Tests/ViShap.Rewind.Generator.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=generator-tests.trx"

      - name: Pack solution
        run: >
          dotnet pack
          Rewind.slnx
          --configuration Release
          --no-build
          --no-restore
          -p:Version=0.0.0-ci
          --output ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            **/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  native-aot:
    name: Native AOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the native toolchain
        timeout-minutes: 10
        run: |
          set -euo pipefail

          if ! command -v clang > /dev/null; then
            VERSIONED="$(ls /usr/bin/clang-[0-9]* 2> /dev/null | sort -V | tail -n 1 || true)"
            if [[ -n "$VERSIONED" ]]; then
              sudo ln -s "$VERSIONED" /usr/local/bin/clang
            fi
          fi

          if command -v clang > /dev/null && [[ -f /usr/include/zlib.h ]]; then
            echo "Native toolchain already present: $(clang --version | head -n 1)"
            exit 0
          fi

          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && sudo apt-get -o Acquire::Retries=3 install -y clang zlib1g-dev; then
              exit 0
            fi
            echo "apt-get failed (attempt $attempt); retrying"
            sleep 20
          done

          exit 1

      - name: Publish the consumer with native AOT
        run: |
          set -o pipefail
          dotnet publish tests/ViShap.Rewind.AotConsumer/ViShap.Rewind.AotConsumer.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --output artifacts/aot | tee publish.log
          if grep -E "warning IL[0-9]{4}" publish.log; then exit 1; fi

      - name: Run it native and under the JIT, and compare
        run: |
          set -o pipefail
          artifacts/aot/ViShap.Rewind.AotConsumer | tee aot.txt
          dotnet build tests/ViShap.Rewind.AotConsumer/ViShap.Rewind.AotConsumer.csproj --configuration Release
          dotnet run --project tests/ViShap.Rewind.AotConsumer/ViShap.Rewind.AotConsumer.csproj --configuration Release --no-build > jit.txt
          diff aot.txt jit.txt
