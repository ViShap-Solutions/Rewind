name: Rewind CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'support/**'

  push:
    branches:
      - main
      - 'release/**'
      - 'support/**'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and pack (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10 SDK and the .NET 8 and 9 runtimes the tests run on
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore solution
        run: dotnet restore Rewind.slnx

      - name: Build solution
        run: >
          dotnet build
          Rewind.slnx
          --configuration Release
          --no-restore

      - name: Run core tests
        run: >
          dotnet test
          tests/ViShap.Rewind.Core.Tests/ViShap.Rewind.Core.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=core-tests.trx"

      - name: Run generator tests
        run: >
          dotnet test
          tests/ViShap.Rewind.Generator.Tests/ViShap.Rewind.Generator.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=generator-tests.trx"

      # PostgreSQL and SQL Server run in Linux containers, which the Linux runner's Docker provides.
      - name: Run integration tests (PostgreSQL, SQL Server, EF Core, UI)
        if: runner.os == 'Linux'
        run: >
          dotnet test
          tests/ViShap.Rewind.Integration.Tests/ViShap.Rewind.Integration.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=integration-tests.trx"

      # Windows runners have no Linux containers: the UI tests still run there.
      - name: Run UI integration tests
        if: runner.os == 'Windows'
        run: >
          dotnet test
          tests/ViShap.Rewind.Integration.Tests/ViShap.Rewind.Integration.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~.Ui."
          --logger "trx;LogFileName=integration-ui-tests.trx"

      - name: Pack solution
        run: >
          dotnet pack
          Rewind.slnx
          --configuration Release
          --no-build
          --no-restore
          -p:Version=0.0.0-ci
          --output ./artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}-${{ github.sha }}
          path: |
            **/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  native-aot:
    name: Native AOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Setup .NET 10 SDK and the .NET 8 runtime the net8.0 consumer runs on
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the native toolchain
        timeout-minutes: 10
        run: |
          set -euo pipefail

          if ! command -v clang > /dev/null; then
            VERSIONED="$(ls /usr/bin/clang-[0-9]* 2> /dev/null | sort -V | tail -n 1 || true)"
            if [[ -n "$VERSIONED" ]]; then
              sudo ln -s "$VERSIONED" /usr/local/bin/clang
            fi
          fi

          if command -v clang > /dev/null && [[ -f /usr/include/zlib.h ]]; then
            echo "Native toolchain already present: $(clang --version | head -n 1)"
            exit 0
          fi

          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update \
              && sudo apt-get -o Acquire::Retries=3 install -y clang zlib1g-dev; then
              exit 0
            fi
            echo "apt-get failed (attempt $attempt); retrying"
            sleep 20
          done

          exit 1

      - name: Publish the consumer with native AOT, on net10.0 and net8.0
        run: |
          set -o pipefail
          for framework in net10.0 net8.0; do
            dotnet publish tests/ViShap.Rewind.AotConsumer/ViShap.Rewind.AotConsumer.csproj \
              --configuration Release \
              --framework "$framework" \
              --runtime linux-x64 \
              --output "artifacts/aot/$framework" | tee "publish-$framework.log"
            if grep -E "warning IL[0-9]{4}" "publish-$framework.log"; then exit 1; fi
          done

      - name: Run it native and under the JIT, and compare
        run: |
          set -o pipefail
          dotnet build tests/ViShap.Rewind.AotConsumer/ViShap.Rewind.AotConsumer.csproj --configuration Release
          for framework in net10.0 net8.0; do
            "artifacts/aot/$framework/ViShap.Rewind.AotConsumer" | tee "aot-$framework.txt"
            dotnet run --project tests/ViShap.Rewind.AotConsumer/ViShap.Rewind.AotConsumer.csproj --configuration Release --framework "$framework" --no-build > "jit-$framework.txt"
            diff "aot-$framework.txt" "jit-$framework.txt"
          done
          diff aot-net10.0.txt aot-net8.0.txt
